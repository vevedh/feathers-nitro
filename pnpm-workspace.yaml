packages:
  - playground/*

# Reproducibility and supply-chain policy for pnpm 10.x.
packageManagerStrictVersion: true
minimumReleaseAge: 20160
# Temporary Patch 015 maturity exceptions for the reviewed coordinated Nuxt/Vite/Vue train.
# Remove once these releases have all cleared the 14-day window.
minimumReleaseAgeExclude:
  - '@nuxt/test-utils'
  - '@vue/*'
  - '@vitest/*'
  - 'magic-string'
  - 'vite'
  - 'vitest'
  - 'vue'
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  unrs-resolver: true

catalog:
  '@feathersjs/adapter-commons': '^5.0.49'
  '@feathersjs/authentication': '^5.0.49'
  '@feathersjs/authentication-client': '^5.0.49'
  '@feathersjs/authentication-local': '^5.0.49'
  '@feathersjs/cli': '5.0.49'
  '@feathersjs/configuration': '^5.0.49'
  '@feathersjs/errors': '^5.0.49'
  '@feathersjs/express': '^5.0.49'
  '@feathersjs/feathers': '^5.0.49'
  '@feathersjs/koa': '^5.0.49'
  '@feathersjs/memory': '^5.0.49'
  '@feathersjs/rest-client': '^5.0.49'
  '@feathersjs/schema': '^5.0.49'
  '@feathersjs/socketio': '^5.0.49'
  '@feathersjs/socketio-client': '^5.0.49'
  '@feathersjs/transport-commons': '^5.0.49'
  '@feathersjs/typebox': '^5.0.49'
  '@gabortorma/antfu-eslint-config': '3.2.0'
  '@gabortorma/nuxt-eslint-layer': '1.0.0'
  '@nuxt/schema': 4.5.2
  '@nuxt/test-utils': 4.2.0
  '@pinia/nuxt': '0.11.3'
  '@types/koa': ^3.0.3
  '@types/mocha': '^10.0.10'
  '@types/node': '^22.20.0'
  'axios': '^1.18.1'
  'compression': '^1.8.1'
