  engine.io: ^6.6.9
  eslint: 9.39.5
  express: ^4.22.2
  h3: 1.15.11
  'mocha': '11.7.6'
  nitropack: 2.13.4
  'nodemon': '^3.1.14'
  nuxi: 3.37.0
  'nuxt': '4.5.2'
  release-it: 20.2.0
  'rolldown': '1.2.4'
  taze: 19.14.1
  unbuild: 3.6.1
  'vite': '8.2.2'
  'vitest': '4.1.11'
  'vue': '3.5.42'
  'ofetch': '^1.5.1'
  'pinia': '3.0.4'
